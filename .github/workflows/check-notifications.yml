name: בדיקת התראות

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  check-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: בדיקת התראות
        run: |
          curl -f -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mitmachim-ivr.vercel.app/api/cron/check-notifications"
